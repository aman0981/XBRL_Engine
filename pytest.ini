[pytest]
pythonpath = src
testpaths = tests
asyncio_mode = auto
addopts = -ra -m "not docker and not integration_db and not live_sec and not live_esef"
markers =
    docker: builds the Docker image and runs the container. Skipped by default
        because it needs a running Docker daemon and takes ~30 s. Run with
        `pytest -m docker`.
    integration_db: requires host Postgres at XIE_TEST_DB_URL; creates a
        dedicated xie_test_<uuid> schema per session and drops it on teardown.
        Auto-skipped when the env var is absent. Run with `pytest -m integration_db`.
    live_sec: round-trip against data.sec.gov via pytest-recording cassettes
        (committed under tests/fixtures/cassettes/). Replay-only by default;
        refresh with `pytest -m live_sec --record-mode=new_episodes`.
    live_esef: round-trip against filings.xbrl.org via pytest-recording
        cassettes. Same recording rule as live_sec.
